name: Synthetic validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch verified official test host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          $checksums = @{
            '0.89.0' = 'd7ec068c07be545d4ba37edd37e482444370ef2684463a734c78897c1091f7b8'
            '0.90.0' = 'da0faae70e09fd6bab8e61c2f317b98c2f01a281a24dea041cb60473df1eb65c'
          }
          foreach ($version in $checksums.Keys) {
            $asset = "PortfolioPerformance-$version-win32.win32.x86_64.zip"
            $archive = ".build/$asset"
            Invoke-WebRequest "https://github.com/portfolio-performance/portfolio/releases/download/$version/$asset" -OutFile $archive
            if ((Get-FileHash $archive).Hash -ne $checksums[$version]) { throw "Host $version archive checksum mismatch" }
            Expand-Archive $archive ".build/official-$version"
          }
      - name: Build
        shell: pwsh
        run: ./scripts/Build.ps1 -PortfolioPath .build/official-0.89.0/portfolio -JavaHome $env:JAVA_HOME
      - name: Synthetic importer regression
        shell: pwsh
        run: |
          foreach ($version in '0.89.0', '0.90.0') {
            pwsh -NoProfile -File ./scripts/Test.ps1 -PortfolioPath ".build/official-$version/portfolio" -JavaHome $env:JAVA_HOME
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Installer and simulated-update regression
        shell: pwsh
        run: |
          foreach ($version in '0.89.0', '0.90.0') {
            python tests/test_installer.py --portfolio ".build/official-$version/portfolio" --java-home "$env:JAVA_HOME"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
